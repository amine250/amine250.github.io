<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amine ZAINE (@amine250)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --text: #c9cdd7;
    --text-dim: #5a5f72;
    --accent: #64ffda;
    --accent-dim: rgba(100, 255, 218, 0.08);
    --accent2: #7c6aff;
    --accent3: #ff6a8a;
    --glow: rgba(100, 255, 218, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
  }

  /* Grid background */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.3;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
    z-index: 0;
  }

  /* Ambient glow */
  .ambient {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    z-index: 0;
    pointer-events: none;
  }
  .ambient-1 { background: var(--accent); top: -200px; left: -100px; }
  .ambient-2 { background: var(--accent2); bottom: -200px; right: -100px; }

  .container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Terminal header */
  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    opacity: 0;
    animation: fadeSlideDown 0.6s ease forwards;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
  }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #28c840; }
  .terminal-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 12px;
  }

  /* Main card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
    padding: 48px 40px;
    opacity: 0;
    animation: fadeSlideDown 0.6s ease 0.1s forwards;
  }

  .prompt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .prompt-symbol { color: var(--accent); }

  .name {
    font-family: 'Outfit', sans-serif;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1.05;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 40px;
    padding-left: 2px;
  }
  .tagline .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    margin-left: 4px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin-bottom: 36px;
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeSlideUp 0.5s ease forwards;
  }
  .link-item:nth-child(1) { animation-delay: 0.3s; }
  .link-item:nth-child(2) { animation-delay: 0.4s; }
  .link-item:nth-child(3) { animation-delay: 0.5s; }

  .link-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-dim), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .link-item:hover {
    border-color: var(--accent);
    transform: translateX(6px);
    box-shadow: 0 0 24px var(--glow);
  }
  .link-item:hover::before { opacity: 1; }
  .link-item:hover .link-icon { color: var(--accent); }
  .link-item:hover .link-arrow { opacity: 1; transform: translateX(0); }

  .link-icon {
    font-size: 22px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    transition: color 0.3s;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }

  .link-content {
    flex: 1;
    position: relative;
    z-index: 1;
  }
  .link-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 2px;
  }
  .link-desc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .link-arrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    opacity: 0;
    transform: translateX(-8px);
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
  }

  /* Tag colors */
  .tag-blog .link-icon { color: var(--accent); }
  .tag-efootball .link-icon { color: var(--accent3); }
  .tag-cheatsheet .link-icon { color: var(--accent2); }

  /* Footer */
  .footer {
    margin-top: 32px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    opacity: 0;
    animation: fadeIn 0.6s ease 0.7s forwards;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Animations */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Mobile */
  @media (max-width: 600px) {
    .card { padding: 32px 24px; }
    .name { font-size: 40px; letter-spacing: -1px; }
    .link-item { padding: 14px 16px; gap: 12px; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="container">
  <div class="terminal-bar">
    <div class="dot dot-red"></div>
    <div class="dot dot-yellow"></div>
    <div class="dot dot-green"></div>
    <span class="terminal-title">~/amine250</span>
  </div>

  <div class="card">
    <div class="prompt">
      <span class="prompt-symbol">❯</span> cat links.md
    </div>
    <h1 class="name">Amine Zaine</h1>
    <div class="tagline">["cloud architect", "open source builder"]<span class="cursor"></span></div>

    <div class="divider"></div>

    <div class="links">
      <a href="https://zaine.me" target="_blank" class="link-item tag-blog">
        <div class="link-icon">✦</div>
        <div class="link-content">
          <div class="link-title">zaine.me</div>
          <div class="link-desc">blog · devops · cloud · platform eng</div>
        </div>
        <div class="link-arrow">→</div>
      </a>

      <a href="https://amine250.github.io/efootball-managers/" target="_blank" class="link-item tag-efootball">
        <div class="link-icon">⚽</div>
        <div class="link-content">
          <div class="link-title">eFootball Managers</div>
          <div class="link-desc">efootball tools & resources</div>
        </div>
        <div class="link-arrow">→</div>
      </a>

      <a href="https://amine250.github.io/cheatsheet/" target="_blank" class="link-item tag-cheatsheet">
        <div class="link-icon">⌘</div>
        <div class="link-content">
          <div class="link-title">Cheatsheet</div>
          <div class="link-desc">quick references & shortcuts</div>
        </div>
        <div class="link-arrow">→</div>
      </a>
    </div>
  </div>

  <div class="footer">
    built with ☕ — <a href="https://github.com/amine250" target="_blank">github.com/amine250</a>
  </div>
</div>

</body>
</html>
